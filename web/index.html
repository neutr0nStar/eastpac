<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <svg class="eye" viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="eyeg" x1="0" x2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
          <path d="M2 16C7 8 11 6 16 6s9 2 14 10c-5 8-9 10-14 10S7 24 2 16z" fill="none" stroke="url(#eyeg)" stroke-width="2.4"/>

      <div class="activity-head"><span>Agent activity</span><span class="live-dot" id="live-dot"></span></div>
      <div class="working" id="working"></div>
